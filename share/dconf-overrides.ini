# gsettings.tsv（desktop ツール）の値を、USB 用に上書き・追加する
# 書式は dconf のキーファイル。区分の名前は先頭と末尾の / を外したパス

[org/gnome/shell]
# Dock は USB に入っている物だけ（Chrome・Burp・Obsidian・Discord・VSCode は入れていない）
favorite-apps=['firefox-esr.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Terminal.desktop', 'gparted.desktop', 'org.gnome.Settings.desktop']
# ProxySwitcher は入っていないので外した
enabled-extensions=['apps-menu@gnome-shell-extensions.gcampax.github.com', 'dash-to-dock@micxgx.gmail.com', 'ding@rastersoft.com', 'user-theme@gnome-shell-extensions.gcampax.github.com', 'ubuntu-appindicators@ubuntu.com', 'tiling-assistant@leleat-on-github', 'system-monitor@gnome-shell-extensions.gcampax.github.com', 'drive-menu@gnome-shell-extensions.gcampax.github.com', 'places-menu@gnome-shell-extensions.gcampax.github.com', 'top-panel-vpnip@kali.org']

[org/gnome/desktop/background]
picture-uri='file:///usr/share/backgrounds/ch4n24n-os/wallpaper.png'
picture-uri-dark='file:///usr/share/backgrounds/ch4n24n-os/wallpaper.png'
picture-options='zoom'
primary-color='#15151b'

[org/gnome/desktop/screensaver]
picture-uri='file:///usr/share/backgrounds/ch4n24n-os/wallpaper.png'

[org/gnome/desktop/media-handling]
# 挿した PC のディスクを勝手にマウントしない（起動の引数 noautomount と二重に効かせる）
automount=false
automount-open=false

[org/gnome/desktop/interface]
# 今の PC と同じ 24 時間表示（USB の既定は 12h だった。今の PC では既定のままなので gsettings.tsv に無い）
clock-format='24h'
