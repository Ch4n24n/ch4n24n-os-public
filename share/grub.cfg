# Ch4n24n OS の起動メニュー（UEFI。Kali の grub.cfg を元にした）
# 既定は「暗号化した保存領域つき」。保存領域が無い USB・VM では、そのまま「何も残さない」と同じに動く
# どの項目も、挿した PC のディスクを勝手にマウントせず、スワップも使わない（Kali の forensic mode と同じ）
source /boot/grub/config.cfg

menuentry "Ch4n24n OS (encrypted persistence)" {
        linux @KERNEL_LIVE@ @APPEND_LIVE@ persistent=cryptsetup persistence-encryption=luks persistence systemd.swap=no noautomount
        initrd @INITRD_LIVE@
}
menuentry "Ch4n24n OS (encrypted persistence, load to RAM)" {
        linux @KERNEL_LIVE@ @APPEND_LIVE@ toram persistent=cryptsetup persistence-encryption=luks persistence systemd.swap=no noautomount
        initrd @INITRD_LIVE@
}
menuentry "Ch4n24n OS (no persistence)" {
        linux @KERNEL_LIVE@ @APPEND_LIVE@ systemd.swap=no noautomount
        initrd @INITRD_LIVE@
}

submenu 'Utilities...' --hotkey=u {

        source /boot/grub/theme.cfg

        # Kali の既定の起動（自動マウントあり・fail-safe）
        @LINUX_LIVE@

        # Memtest (if any)
        if @ENABLE_MEMTEST@; then
                source /boot/grub/memtest.cfg
        fi

        # Firmware setup (UEFI)
        if [ "${grub_platform}" = "efi" ]; then
                menuentry "UEFI Firmware Settings" --hotkey=f {
                        fwsetup
                }
        fi

}
